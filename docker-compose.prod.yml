# Production overrides
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires:
#   - The shared Traefik stack at ~/Projects/traefik to be running first
#     (it owns the external `proxy` network and terminates TLS).
#   - PROD_HOSTNAME set in .env (e.g. PROD_HOSTNAME=soprano.example.com).

services:
  php:
    build:
      context: ./php
      args:
        BUILD_MODE: prod
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ${MUSIC_DIR}:/music
      # Override: mount prod.ini instead of dev.ini
      - ./php/prod.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro
    deploy:
      resources:
        limits:
          memory: 2048M

  nginx:
    restart: unless-stopped
    volumes:
      - ${MUSIC_DIR}:/music:ro
    networks:
      - net
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.soprano.rule=Host(`${PROD_HOSTNAME}`)
      - traefik.http.routers.soprano.entrypoints=websecure
      - traefik.http.routers.soprano.tls.certresolver=cloudflare
      - traefik.http.routers.soprano-http.rule=Host(`${PROD_HOSTNAME}`)
      - traefik.http.routers.soprano-http.entrypoints=web
      - traefik.http.routers.soprano-http.middlewares=soprano-redirect
      - traefik.http.middlewares.soprano-redirect.redirectscheme.scheme=https
      - traefik.http.services.soprano.loadbalancer.server.port=80
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    restart: unless-stopped
    volumes:
      - ./db_data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    deploy:
      resources:
        limits:
          memory: 192M

networks:
  proxy:
    external: true
