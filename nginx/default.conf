upstream php-fpm {
  server php:9000;
  keepalive 16;
}

server {
  listen 80;
  # localhost plus *.localhost, kept for dev hostnames. The app itself no
  # longer uses subdomains — admin lives at /admin and the API at /api/v1.
  server_name localhost *.localhost;

  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.18.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  client_max_body_size 32m;

  root /var/www/html/public;
  index index.php index.html;

  # Gzip compression (level 4 — good ratio, low CPU for shared VPS)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  # User uploads: serve cached, but keep them out of search indexes.
  # ^~ ensures this wins over the generic image regex below.
  location ^~ /uploads/ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log off;
  }

  # The service worker script must NEVER be cached long-term, or a bumped
  # CACHE_VERSION never reaches the browser and the SW can't update itself.
  # Exact-match location wins over the css|js regex below.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    access_log off;
  }

  # CSS/JS: revalidate on every load instead of immutable 1y caching. nginx
  # answers unchanged files with a cheap 304 (ETag/Last-Modified), so new
  # deploys appear immediately without needing to bump a ?v= buster. The extra
  # conditional request is negligible for a single-user server.
  location ~* \.(?:css|js)$ {
    add_header Cache-Control "no-cache" always;
    access_log off;
  }

  location ~* \.(?:woff2?|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location ~* \.(?:jpg|jpeg|png|gif|webp|avif|ico|svg)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
  }

  # X-Accel-Redirect target for audio streaming.
  # PHP authorizes the track lookup, then nginx serves the file and handles
  # byte ranges natively — freeing the PHP-FPM worker immediately.
  location /_protected/music/ {
    internal;
    alias /music/;
    # Revalidate instead of long-term caching: the bytes a stream URL maps to
    # can change (raw source vs warmed Opus transcode). nginx answers
    # conditional requests with a cheap 304, so this stays fast without pinning
    # a stale or previously un-decodable response in the browser.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Logged on purpose. nginx applies the *final* location's access_log to an
    # internally redirected request, so turning it off here silently swallowed
    # every successful /player/stream request — only client-aborted ones (499,
    # which never reach this location) were left in the log, making it look like
    # almost nothing streamed. Lining a playback stop up against the request
    # that served the audio is the reason this log exists.
  }

  # X-Accel-Redirect target for transcoded (Opus) audio. The cache lives in the
  # app's storage dir, already mounted into this container at /var/www/html.
  location /_protected/transcode/ {
    internal;
    alias /var/www/html/storage/transcode/;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Logged, for the same reason as /_protected/music/ above.
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass php-fpm;
    fastcgi_keep_conn on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    # Pass the Host header to PHP so absolute-URL building works
    fastcgi_param HTTP_HOST $host;

    # Buffer tuning and timeouts (match PHP's 30s max_execution_time)
    fastcgi_buffer_size 16k;
    fastcgi_buffers 8 16k;
    fastcgi_connect_timeout 10s;
    fastcgi_send_timeout 30s;
    fastcgi_read_timeout 30s;
  }

  # Deny access to all dotfiles (.env, .git, .htaccess, etc.)
  location ~ /\. {
    deny all;
  }
}
